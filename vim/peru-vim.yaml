imports:
    hitags:       .vim/pack/hitags/start/hitags/
    fmt:          .vim/pack/fmt/start/fmt/
    quickui:      .vim/pack/quickui/start/quickui/
    closetag:     .vim/pack/closetag/start/closetag/
    markx:        .vim/pack/markx/start/markx/
    editorconfig: .vim/pack/editorconfig/start/editorconfig/
    squish:       .vim/pack/squish/start/squish/
#    drawit:       .vim/pack/drawit/start/drawit/

git module hitags:
    url: https://github.com/agvxov/Vim-HiTags.git
    pick: [plugin, bin, cache]

git module fmt:
    url: https://github.com/agvxov/vim-fmt.git
    export: .vim/
    pick: .vim/plugin

git module quickui:
    url: https://github.com/skywind3000/vim-quickui.git
    pick: [autoload, colors, docs, plugin]

git module closetag:
    url: https://github.com/alvan/vim-closetag.git
    pick: [plugin, ftplugin]

git module editorconfig:
    url: https://github.com/editorconfig/editorconfig-vim.git
    pick: [autoload, doc, plugin]
git module squish:
    url: https://github.com/agvxov/vim-squish.git
    pick: [autoload, ftdetect, plugin, syntax]
    rev: d019069a46e3e74b0defdc790462ebd3c5554f2b

curl module markx:
    url: https://www.vim.org/scripts/download_script.php?src_id=29181
    unpack: tar
    export: markx
    pick: [markx/autoload, markx/doc, markx/plugin]

